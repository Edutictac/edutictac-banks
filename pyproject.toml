[project]
name = "edutictac-banks"
version = "0.2.0"
description = "Motores compartidos de bancos de recursos libres (imágenes, iconos y sonidos) para EduTicTac"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["edutictac_banks"]

[tool.setuptools.package-data]
edutictac_banks = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
